services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afterglow
      POSTGRES_USER: afterglow
      POSTGRES_PASSWORD: afterglow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterglow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://afterglow:afterglow@postgres:5432/afterglow
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIRECTORY: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m services.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://afterglow:afterglow@postgres:5432/afterglow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

