name: Afterglow
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Afterglow:
    type: application
    platform: iOS
    sources:
      - path: Afterglow
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Afterglow/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.jonzhang.afterglow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  AfterglowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AfterglowTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.jonzhang.afterglow.tests
    dependencies:
      - target: Afterglow
  AfterglowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AfterglowUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.jonzhang.afterglow.uitests
    dependencies:
      - target: Afterglow
schemes:
  Afterglow:
    build:
      targets:
        Afterglow: all
    test:
      targets: [AfterglowTests, AfterglowUITests]
