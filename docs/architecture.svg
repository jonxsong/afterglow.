<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="898" viewBox="0 0 1120 898" role="img" aria-labelledby="title description">
  <title id="title">Afterglow system architecture</title>
  <desc id="description">The public Next.js website and native SwiftUI apps for iPhone and Mac use the same hosted Site Worker. Native distribution is pending. The Apple apps use optional Core Location, a same-day forecast cache, and Vision-assisted photo comparison on the device without asking for sign-in. The Worker computes forecasts from Open-Meteo or 7Timer, saves recent weather in D1, and provides optional web photo interpretation through OpenAI. A separate self-hosted Next.js and FastAPI deployment uses PostgreSQL, Redis, and private object storage. Offline model evaluation is separate from live inference.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#80778a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; fill: #272232; }
      .section { font-size: 21px; font-weight: 700; fill: #332a42; }
      .heading { font-size: 19px; font-weight: 700; fill: #272232; }
      .body { font-size: 16px; font-weight: 400; fill: #4f485a; }
      .note { font-size: 14px; font-weight: 500; fill: #665b70; }
      .card { fill: #fff; stroke: #dcd5df; stroke-width: 1.2; }
      .flow { fill: none; stroke: #80778a; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="898" rx="18" fill="#faf8f5"/>
  <rect x="32.5" y="28.5" width="50" height="50" rx="13" fill="#f2e3ed" stroke="#e4d2e2"/>
  <path d="M45 59.5h25M49 56a8.5 8.5 0 0 1 17 0M50 64.5h15" fill="none" stroke="#784d76" stroke-width="2.2" stroke-linecap="round"/>
  <text x="100" y="63" class="title">Afterglow architecture</text>
  <text x="100" y="89" class="body">Sunset color forecasts and photo comparison</text>
  <path d="M32 112.5h1056" stroke="#e1dbe5"/>

  <g aria-label="Hosted forecast service and clients">
    <rect x="32.5" y="133.5" width="1055" height="426" rx="16" fill="#f2edf5" stroke="#e2d8e8"/>
    <text x="56" y="166" class="section">Hosted forecast service and clients</text>
    <text x="1064" y="164.5" class="note" text-anchor="end">afterglow.jonzhang.dev</text>

    <rect x="56" y="185" width="306" height="150" rx="11" class="card"/>
    <text x="74" y="218" class="heading">Next.js in the browser</text>
    <text x="74" y="245" class="body">City search + GeoNames fallback</text>
    <text x="74" y="267" class="body">Shareable forecasts and sky timeline</text>
    <text x="74" y="289" class="body">Private photo palette comparison</text>
    <path d="M74 301.5h270" stroke="#eee8f0"/>
    <text x="74" y="322" class="note">Public website · same-day forecast cache</text>

    <rect x="56" y="355" width="306" height="182" rx="11" class="card"/>
    <text x="74" y="388" class="heading">SwiftUI · iPhone and Mac</text>
    <text x="74" y="416" class="body">City search · optional Core Location</text>
    <text x="74" y="441" class="body">On-device Vision and photo match</text>
    <text x="74" y="466" class="body">Same-day cache · no sign-in</text>
    <path d="M74 484.5h270" stroke="#eee8f0"/>
    <text x="74" y="511" class="note">Native apps · distribution pending</text>

    <rect x="418" y="274" width="294" height="202" rx="11" class="card"/>
    <text x="436" y="307" class="heading">Site Worker</text>
    <text x="436" y="336" class="body">Shared forecast and city search API</text>
    <text x="436" y="361" class="body">Weather validation and failover</text>
    <text x="436" y="386" class="body">D1 snapshots for outages</text>
    <path d="M436 429.5h258" stroke="#eee8f0"/>
    <text x="436" y="454" class="note">OpenAI key stays in the Worker</text>

    <rect x="768" y="274" width="296" height="94" rx="11" class="card"/>
    <text x="786" y="303" class="heading">Weather providers</text>
    <text x="786" y="329" class="body">Open-Meteo weather + geocoding</text>
    <text x="786" y="351" class="body">7Timer backup · NOAA GFS</text>

    <rect x="768" y="382" width="296" height="94" rx="11" class="card"/>
    <text x="786" y="411" class="heading">OpenAI Responses API</text>
    <text x="786" y="437" class="body">Optional web photo interpretation</text>
    <text x="786" y="459" class="body">Response storage disabled</text>

    <path d="M369 261h10q10 0 10 10v55q0 10 10 10h12" class="flow"/>
    <path d="M369 448h10q10 0 10-10v-18q0-10 10-10h12" class="flow"/>
    <path d="M719 321h42" class="flow"/>
    <path d="M719 429h42" class="flow" stroke-dasharray="5 4"/>
  </g>

  <g aria-label="Self-hosted deployment" transform="translate(0 148)">
    <rect x="32.5" y="433.5" width="1055" height="284" rx="16" fill="#f7eee7" stroke="#eadfd7"/>
    <text x="56" y="466" class="section">Self-hosted deployment</text>
    <text x="1064" y="464.5" class="note" text-anchor="end">Docker or AWS</text>

    <rect x="56" y="484" width="276" height="129" rx="11" class="card"/>
    <text x="74" y="515" class="heading">Next.js web app</text>
    <text x="74" y="544" class="body">City selection and forecasts</text>
    <text x="74" y="569" class="body">Sunset photo submission</text>

    <rect x="388" y="484" width="296" height="129" rx="11" class="card"/>
    <text x="406" y="515" class="heading">FastAPI</text>
    <text x="406" y="544" class="body">Open-Meteo forecast input</text>
    <text x="406" y="569" class="body">Solar geometry + heuristics</text>
    <text x="406" y="594" class="body">Snapshots and photo evaluation</text>

    <rect x="740" y="484" width="324" height="129" rx="11" class="card"/>
    <text x="758" y="515" class="heading">Storage and jobs</text>
    <text x="758" y="544" class="body">PostgreSQL · forecasts + locations</text>
    <text x="758" y="569" class="body">Redis / RQ · caching and jobs</text>
    <text x="758" y="594" class="body">Private objects · photo storage</text>

    <path d="M339 549h42" class="flow"/>
    <path d="M691 549h42" class="flow"/>

    <rect x="56" y="634" width="1008" height="59" rx="11" fill="#fdfaf7" stroke="#c7b5c2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="74" y="659" class="heading">Offline model evaluation</text>
    <text x="74" y="680" class="note">Separate from live inference</text>
    <text x="359" y="669" class="body">Consented labels → features → time/location split → train and evaluate</text>
  </g>
</svg>
