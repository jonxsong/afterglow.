<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Afterglow system architecture</title>
  <desc id="desc">An Excalidraw-style diagram showing visitors using the Next.js web app, which calls the FastAPI application and forecast domain. The system integrates with Open-Meteo, PostgreSQL, Redis, private object storage, an RQ worker, and an offline machine-learning pipeline.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="softGrain"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softGrain" mode="multiply"/>
    </filter>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="1" seed="9" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6.5 L1,12" fill="none" stroke="#4c4541" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 42px "Comic Sans MS", "Segoe Print", cursive; fill: #24211f; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #625b57; letter-spacing: 1px; }
      .group { font: 700 15px Inter, Arial, sans-serif; fill: #766d68; letter-spacing: 2.4px; }
      .label { font: 700 23px "Comic Sans MS", "Segoe Print", cursive; fill: #24211f; }
      .body { font: 400 15px Inter, Arial, sans-serif; fill: #514b47; }
      .tiny { font: 400 13px Inter, Arial, sans-serif; fill: #6d6560; }
      .box { stroke: #3d3835; stroke-width: 2.2; filter: url(#rough); }
      .echo { fill: none; stroke: #3d3835; stroke-width: 0.9; opacity: .42; filter: url(#rough); }
      .edge { fill: none; stroke: #4c4541; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); filter: url(#rough); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#fbf8f2" filter="url(#paper)"/>
  <path d="M78 114 C290 72, 478 104, 680 77 S1087 90, 1362 62" fill="none" stroke="#d58ca6" stroke-width="4" opacity=".55" filter="url(#rough)"/>
  <text x="72" y="70" class="title">afterglow. — system map</text>
  <text x="75" y="101" class="subtitle">FROM A PLACE ON THE MAP TO A COLOR FORECAST IN THE SKY</text>

  <text x="72" y="157" class="group">EXPERIENCE</text>
  <text x="468" y="157" class="group">APPLICATION</text>
  <text x="920" y="157" class="group">DATA + ATMOSPHERE</text>

  <rect x="70" y="187" width="300" height="144" rx="28" fill="#f7d5bd" class="box"/>
  <rect x="74" y="191" width="292" height="136" rx="25" class="echo"/>
  <circle cx="118" cy="238" r="22" fill="#fff6ee" stroke="#3d3835" stroke-width="2"/>
  <path d="M85 299 C91 265, 145 265, 151 299" fill="#fff6ee" stroke="#3d3835" stroke-width="2" filter="url(#rough)"/>
  <text x="171" y="232" class="label">Sky chaser</text>
  <text x="171" y="259" class="body">searches a city</text>
  <text x="171" y="282" class="body">decides when to look up</text>

  <rect x="70" y="394" width="300" height="210" rx="26" fill="#efd8e2" class="box"/>
  <rect x="74" y="398" width="292" height="202" rx="23" class="echo"/>
  <text x="101" y="440" class="label">Next.js web</text>
  <text x="101" y="472" class="body">• location search</text>
  <text x="101" y="498" class="body">• tonight + seven days</text>
  <text x="101" y="524" class="body">• predicted sky renderer</text>
  <text x="101" y="550" class="body">• private photo compare</text>
  <rect x="101" y="566" width="215" height="20" rx="10" fill="#f9c58b"/>
  <rect x="144" y="566" width="43" height="20" fill="#f08b6e"/>
  <rect x="187" y="566" width="43" height="20" fill="#cf6683"/>
  <rect x="230" y="566" width="43" height="20" fill="#8e638f"/>
  <rect x="273" y="566" width="43" height="20" rx="0 10 10 0" fill="#4c5278"/>

  <rect x="456" y="187" width="360" height="174" rx="26" fill="#e8e1f4" class="box"/>
  <rect x="460" y="191" width="352" height="166" rx="23" class="echo"/>
  <text x="491" y="232" class="label">FastAPI application</text>
  <text x="491" y="264" class="body">REST + OpenAPI · Pydantic validation</text>
  <text x="491" y="290" class="body">immutable forecast snapshots</text>
  <text x="491" y="316" class="body">upload validation + evaluation</text>
  <text x="491" y="340" class="tiny">structured errors · request IDs · health checks</text>

  <rect x="456" y="419" width="360" height="218" rx="26" fill="#f7d9c9" class="box"/>
  <rect x="460" y="423" width="352" height="210" rx="23" class="echo"/>
  <text x="491" y="463" class="label">Forecast domain</text>
  <text x="491" y="498" class="body">solar elevation + azimuth</text>
  <text x="491" y="526" class="body">cloud-layer feature engineering</text>
  <text x="491" y="554" class="body">atmospheric heuristic baseline</text>
  <path d="M494 580 C541 560, 589 594, 637 574 S733 560, 780 584" fill="none" stroke="#b87079" stroke-width="3" filter="url(#rough)"/>
  <text x="491" y="613" class="tiny">palette · vibrancy · confidence · viewing window</text>

  <rect x="916" y="187" width="424" height="153" rx="26" fill="#dce8f1" class="box"/>
  <rect x="920" y="191" width="416" height="145" rx="23" class="echo"/>
  <text x="953" y="231" class="label">Open-Meteo</text>
  <text x="953" y="262" class="body">geocoding · hourly atmosphere</text>
  <text x="953" y="291" class="body">sunset · clouds · humidity · visibility · rain</text>
  <path d="M1212 231 C1224 205, 1265 206, 1274 232 C1301 226, 1318 243, 1312 263 L1192 263 C1187 244, 1196 233, 1212 231Z" fill="#edf6fb" stroke="#3d3835" stroke-width="2" filter="url(#rough)"/>

  <rect x="916" y="397" width="194" height="126" rx="24" fill="#e7edda" class="box"/>
  <rect x="920" y="401" width="186" height="118" rx="21" class="echo"/>
  <text x="946" y="436" class="label">PostgreSQL</text>
  <text x="946" y="466" class="body">locations + weather</text>
  <text x="946" y="490" class="body">snapshots + scores</text>

  <rect x="1146" y="397" width="194" height="126" rx="24" fill="#f4dfd2" class="box"/>
  <rect x="1150" y="401" width="186" height="118" rx="21" class="echo"/>
  <text x="1179" y="436" class="label">Redis + RQ</text>
  <text x="1179" y="466" class="body">15 min cache</text>
  <text x="1179" y="490" class="body">locks + job queue</text>

  <rect x="916" y="569" width="194" height="126" rx="24" fill="#f0ddeb" class="box"/>
  <rect x="920" y="573" width="186" height="118" rx="21" class="echo"/>
  <text x="952" y="609" class="label">Private S3</text>
  <text x="952" y="639" class="body">observed photos</text>
  <text x="952" y="663" class="body">encrypted objects</text>

  <rect x="1146" y="569" width="194" height="126" rx="24" fill="#eee8d2" class="box"/>
  <rect x="1150" y="573" width="186" height="118" rx="21" class="echo"/>
  <text x="1193" y="609" class="label">Worker</text>
  <text x="1176" y="639" class="body">idempotent refresh</text>
  <text x="1176" y="663" class="body">scheduled ingestion</text>

  <rect x="456" y="735" width="884" height="104" rx="26" fill="#f1eee6" class="box"/>
  <rect x="460" y="739" width="876" height="96" rx="23" class="echo"/>
  <text x="491" y="775" class="label">Offline ML lane — gated from production</text>
  <text x="491" y="808" class="body">labeled photos → color extraction → time/location split → train + evaluate</text>
  <text x="1088" y="808" class="tiny">promote only if it beats baseline</text>

  <path d="M219 332 L219 384" class="edge"/>
  <text x="232" y="367" class="tiny">opens</text>
  <path d="M371 485 C407 480, 416 300, 445 286" class="edge"/>
  <text x="384" y="385" class="tiny" transform="rotate(-78 384 385)">HTTPS / JSON</text>
  <path d="M636 362 L636 407" class="edge"/>
  <text x="649" y="392" class="tiny">orchestrates</text>
  <path d="M817 248 L904 248" class="edge"/>
  <text x="840" y="231" class="tiny">fetches</text>
  <path d="M817 472 C858 458, 878 454, 905 454" class="edge"/>
  <path d="M817 515 C870 548, 1082 548, 1134 500" class="edge"/>
  <path d="M817 557 C864 568, 881 619, 905 624" class="edge"/>
  <path d="M1238 524 L1238 557" class="edge"/>
  <path d="M1145 632 C1118 631, 1129 501, 1121 482" class="edge dash"/>
  <path d="M1010 706 L1010 725" class="edge dash"/>
  <path d="M636 648 L636 724" class="edge dash"/>

  <path d="M74 708 C161 681, 272 696, 368 676" fill="none" stroke="#8d83ba" stroke-width="3" filter="url(#rough)"/>
  <text x="72" y="744" class="group">DELIVERY</text>
  <text x="72" y="777" class="body">Local: Docker Compose</text>
  <text x="72" y="804" class="body">Cloud: ECS · RDS · ElastiCache</text>
  <text x="72" y="831" class="body">Preview: public .chatgpt.site</text>
</svg>
